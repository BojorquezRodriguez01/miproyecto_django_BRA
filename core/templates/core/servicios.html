<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Servicios</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="max-w-2xl mx-auto py-10 px-6 font-sans">
  <h1 class="text-2xl font-bold mb-6 text-slate-800">Servicios</h1>
  <table class="w-full border border-slate-200 rounded-lg overflow-hidden shadow-sm">
    <thead class="bg-slate-100 border-b border-slate-200">
      <tr>
        <th class="text-left px-4 py-3 text-slate-700 font-semibold">Servicio</th>
        <th class="text-left px-4 py-3 text-slate-700 font-semibold">Precio</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-slate-200">
      {% for servicio in servicios %}
      <tr class="hover:bg-slate-50">
        <td class="px-4 py-3 text-slate-600">{{ servicio.nombre }}</td>
        <td class="px-4 py-3 font-semibold text-slate-700">${{ servicio.precio }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
